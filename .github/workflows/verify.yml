name: Verify VocalStudio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/verify.py --channel chromium
      - run: python build_portable.py dist/VocalStudio.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: VocalStudio-portable
          path: |
            dist/VocalStudio.pyz
            dist/VocalStudio.pyz.sha256
          if-no-files-found: error
